{% extends "base.html" %}{% block title %}Edit recipient{% endblock %}{% block heading %}Edit recipient{% endblock %}
{% block content %}<section class="panel narrow"><h3>Update recipient details</h3><form method="post" class="form-grid"><label>Name *<input name="name" required value="{{ recipient.name }}"></label><label>Phone<input name="phone" value="{{ recipient.phone or '' }}"></label><label>Organization<input name="organization" value="{{ recipient.organization or '' }}"></label><label>Address<input name="address" value="{{ recipient.address or '' }}"></label><div class="actions"><button class="btn btn-primary">Save changes</button><a class="btn" href="{{ url_for('recipients') }}">Cancel</a></div></form></section>{% endblock %}
