{% extends "base.html" %}{% block title %}Edit donation{% endblock %}{% block heading %}Edit donation{% endblock %}
{% block content %}<section class="panel narrow"><h3>Update donation #{{ donation.donation_id }}</h3><form method="post" class="form-grid"><label>Donor *<select name="donor_id">{% for d in donors %}<option value="{{ d.donor_id }}" {% if d.donor_id == donation.donor_id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label><label>Food item *<input name="food_name" required value="{{ donation.food_name }}"></label><div class="inline-fields"><label>Quantity *<input type="number" name="quantity" min="0.01" step="0.01" required value="{{ donation.quantity }}"></label><label>Unit<select name="unit">{% for unit in ['kg','boxes','plates','litres','packets'] %}<option {% if unit == donation.unit %}selected{% endif %}>{{ unit }}</option>{% endfor %}</select></label></div><label>Expiry / use-by time<input type="datetime-local" name="expiry_time" value="{{ donation.expiry_time.strftime('%Y-%m-%dT%H:%M') if donation.expiry_time else '' }}"></label><label>Status<select name="status">{% for status in ['Available','Distributed','Expired'] %}<option {% if status == donation.status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>Notes<textarea name="notes" rows="3">{{ donation.notes or '' }}</textarea></label><div class="actions"><button class="btn btn-primary">Save changes</button><a class="btn" href="{{ url_for('donations') }}">Cancel</a></div></form></section>{% endblock %}
