{% extends "base.html" %}{% block title %}Edit donor{% endblock %}{% block heading %}Edit donor{% endblock %}
{% block content %}<section class="panel narrow"><h3>Update donor details</h3><form method="post" class="form-grid"><label>Name *<input name="name" required value="{{ donor.name }}"></label><label>Phone<input name="phone" value="{{ donor.phone or '' }}"></label><label>Email<input name="email" type="email" value="{{ donor.email or '' }}"></label><label>Address<input name="address" value="{{ donor.address or '' }}"></label><div class="actions"><button class="btn btn-primary">Save changes</button><a class="btn" href="{{ url_for('donors') }}">Cancel</a></div></form></section>{% endblock %}
